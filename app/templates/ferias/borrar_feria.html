{% extends "base.html" %} {% comment %} Confirmacion de borrar feria
{%endcomment %} {% block content %}
<div class="container mt-4">
  <h1 class="mb-4">Borrar Feria</h1>
  <p>¿Estás seguro de que quieres borrar la feria "{{ object.nombre }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, borrar</button>
    <a href="{% url 'ferias:lista_ferias' %}" class="btn btn-secondary"
      >No, volver</a
    >
  </form>
</div>
{% endblock %}
