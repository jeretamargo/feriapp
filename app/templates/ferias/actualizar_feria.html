{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col">
      <h1 class="mb-4">Actualizar Feria</h1>
    </div>
    <div class="col-auto">
      <a href="{% url 'ferias:lista_ferias' %}" class="btn btn-secondary">
        Volver a lista de ferias
      </a>
    </div>
  </div>

  <form method="post" class="needs-validation" novalidate>
    {% csrf_token %}

    <div class="form-group mb-3">
      <label for="id_nombre">Nombre</label>
      {{ form.nombre }}
    </div>

    <div class="form-group mb-3">
      <label for="id_categoria">Categoría</label>
      {{ form.categoria }}
    </div>

    <div class="form-group mb-3">
      <label for="id_fecha_inicio">Fecha de inicio</label>
      {{ form.fecha_inicio }}
    </div>

    <div class="form-group mb-3">
      <label for="id_fecha_fin">Fecha de fin</label>
      {{ form.fecha_fin }}
    </div>

    <div class="form-group mb-3">
      <label for="id_ubicacion">Ubicación</label>
      {{ form.ubicacion }}
    </div>

    <div class="form-group mb-3">
      <label for="id_capacidad_puestos">Capacidad de puestos</label>
      {{ form.capacidad_puestos }}
    </div>

    <div class="form-check mb-3">
      {{ form.activa }}
      <label class="form-check-label" for="id_activa">Activa</label>
    </div>

    <button type="submit" class="btn btn-primary">Actualizar</button>
  </form>
</div>
{% endblock %}
