{% extends "base.html" %}
{%block title %}Confirmar Borrado de Categoria{% endblock title %}

{% block content %}
<h1>Confirmar Borrado de Categoria</h1>
<p>¿Estás seguro de que deseas borrar la categoría "{{ categoria.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, borrar categoría</button>
    <a href="{% url 'ferias:lista_categorias' %}" class="btn btn-secondary">No, cancelar</a>
</form>
{% endblock content %}
