{% extends "base.html" %}
{% block title  %}Editar Categoria{% endblock title%}

{% block content %}
<h1>Editar Categoria</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <div class="">{{ field.label_tag }} {{ field }}</div>
      {% if field.errors %}
      <div class="text-danger">{{ field.errors }}</div>
      {% endif %}
    </div>
    {% endfor %}   
    <button type="submit" class="btn btn-primary">Actualizar Categoria</button> 
    <a class="btn btn-secondary" href="{% url 'ferias:lista_categorias' %}">Cancelar</a>
</form>
{% endblock content %}
