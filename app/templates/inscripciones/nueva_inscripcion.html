{% extends "base.html" %}

{% block title %}
Nueva inscripción
{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-4">
            Nueva inscripción
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">
                Guardar
            </button>

        </form>

    </div>
</div>

{% endblock %}
