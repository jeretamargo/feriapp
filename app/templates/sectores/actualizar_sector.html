{% extends "base.html" %}

{% block title %}Actualizar Sector{% endblock %}

{% block content %}
    <h1>Actualizar Sector</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{% url 'ferias:lista_sector' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
