{% extends "base.html" %}

{% block title %}Borrar Sector{% endblock %}

{% block content %}
    <h1>Borrar Sector</h1>
    <p>¿Estás seguro de que quieres borrar el sector "{{ sector.nombre }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, borrar</button>
        <a href="{% url 'ferias:lista_sector' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
