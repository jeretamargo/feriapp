{% extends "base.html" %} {% block title %} Modificar Perfil {% endblock %}
{%block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header">
          <h3 class="mb-0">Modificar datos del perfil</h3>
        </div>

        <div class="card-body">
          <form method="post">
            {% csrf_token %} {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
              Guardar cambios
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
